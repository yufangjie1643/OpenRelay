<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenRelay - Login</title>
<style>
  :root{--bg:#101211;--card:#181c1a;--text:#eef3ef;--muted:#9aa79e;--accent:#57d6b3;--accent2:#e5bd55;--border:#303932;--input:#0c0f0d;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);background-image:linear-gradient(180deg,rgba(87,214,179,.08),rgba(16,18,17,0) 340px);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
  .login-box{background:linear-gradient(180deg,var(--card),#151816);border:1px solid var(--border);border-radius:8px;padding:2.25rem;width:100%;max-width:400px;box-shadow:0 18px 40px rgba(0,0,0,.24)}
  .login-box h1{font-size:1.45rem;margin-bottom:.5rem;text-align:center;letter-spacing:.02em}
  .login-box p{text-align:center;color:var(--muted);margin-bottom:1.5rem;font-size:.875rem}
  .form-group{margin-bottom:1rem}
  label{display:block;font-size:.875rem;color:var(--muted);margin-bottom:.375rem}
  input{width:100%;padding:.625rem .875rem;border:1px solid var(--border);border-radius:6px;background:var(--input);color:var(--text);font-size:.875rem}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(87,214,179,.12)}
  .btn{width:100%;padding:.625rem;border:1px solid var(--accent);border-radius:6px;background:var(--accent);color:#06110e;font-weight:750;font-size:.875rem;cursor:pointer;margin-top:.5rem}
  .btn:hover{filter:brightness(1.05)}
  .error{color:#f87171;font-size:.875rem;margin-top:.75rem;text-align:center;display:none}
</style>
</head>
<body>
<div class="login-box">
  <h1>OpenRelay</h1>
  <p>个人统一 LLM API 网关</p>
  <p>管理面板登录</p>
  <div class="form-group">
    <label>用户名</label>
    <input type="text" id="username" value="admin">
  </div>
  <div class="form-group">
    <label>密码</label>
    <input type="password" id="password" placeholder="默认密码: admin123">
  </div>
  <button class="btn" onclick="login()">登录</button>
  <div class="error" id="error"></div>
</div>
<script>
async function login() {
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('error');
  errorEl.style.display = 'none';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (data.success) {
      localStorage.setItem('openrelay_token', data.token);
      window.location.href = '/';
    } else {
      errorEl.textContent = data.error || '登录失败';
      errorEl.style.display = 'block';
    }
  } catch (e) {
    errorEl.textContent = '网络错误: ' + e.message;
    errorEl.style.display = 'block';
  }
}
document.getElementById('password').addEventListener('keypress', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
